[package]
name = "oracle-leads-tui"
version = "0.4.1"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "Oracle Leads outreach terminal, using the Ratatui/Crossterm stack used by Codex"

[dependencies]
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["bracketed-paste"] }
serde_json = "=1.0.145"
ureq = { version = "=2.12.1", features = ["json"] }
unicode-width = "=0.2.0"

[profile.release]
strip = true
lto = "thin"
